<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Cartelería</title>
    <!-- Usamos el mismo CSS para estilos generales -->
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #e9ecef; align-items: flex-start; padding-top: 50px; overflow: auto;">

    <div class="admin-container">
        <h2 style="text-align: center;">Administrar Cartelería</h2>

        <form id="admin-form" class="admin-form" enctype="multipart/form-data">
            <label for="targetScreen">Pantalla Destino (ID o 'all'):</label>
            <input type="text" id="targetScreen" placeholder="Ej: 1 (dejar vacío o 'all' para todas)">

            <label for="mainText">Texto Principal:</label>
            <input type="text" id="mainText" placeholder="Ej: ¡Oferta Especial!">

            <label for="subText">Texto Secundario:</label>
            <input type="text" id="subText" placeholder="Ej: Solo por hoy, 50% de descuento.">

            <label for="mediaFile">Subir Archivo (Imagen o Video):</label>
            <input type="file" id="mediaFile" accept="image/*,video/*">

            <p style="text-align:center; font-size: 0.9em; margin-bottom:0;">--- Opcional: Programar Horario ---</p>

            <label for="startTime">Fecha/Hora de Inicio:</label>
            <input type="datetime-local" id="startTime">

            <label for="endTime">Fecha/Hora de Fin:</label>
            <input type="datetime-local" id="endTime">

            <button type="submit">Actualizar / Programar Pantallas</button>
        </form>
    </div>

    <!-- Cargar Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>
</body>
</html>
